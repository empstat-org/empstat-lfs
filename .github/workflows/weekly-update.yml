name: Weekly ILOSTAT update & deploy
on:
  schedule:
    - cron: "0 22 * * 1"     # every Monday 22:00 UTC (Monday night)
  workflow_dispatch: {}
  push:
    branches: [ main ]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r pipeline/requirements.txt
      - name: Fetch ILOSTAT data & rebuild rankings
        working-directory: pipeline
        run: python fetch_and_rank.py  --out ../web/data
      - name: Sanity-check the output
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("web/data/rankings.json"))
          n = len(d.get("countries", []))
          print(f"countries scored: {n}")
          sys.exit(0 if n >= 50 else 1)
          PY
      - name: Commit updated data (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "No data changes this week."
            exit 0
          fi
          git commit -m "Weekly ILOSTAT update ($(date -u +%Y-%m-%d))"
          # The checkout is pinned to the commit that was current when this run was
          # *queued*, so main may have moved on by now (e.g. a manual push, or another
          # run). Replay our data commit on top of the latest main before pushing,
          # keeping our freshly generated files if the same files changed upstream.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Could not push after 3 attempts"; exit 1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
